server:
  port: 8080

spring:
  application:
    name: campus-market
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/campusdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE;NON_KEYWORDS=USER
    username: sa
    password: ""
  sql:
    init:
      mode: always
      encoding: UTF-8
  h2:
    console:
      enabled: true
      path: /h2-console
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 3600

mybatis:
  configuration:
    map-underscore-to-camel-case: true

app:
  upload-dir: uploads
  token-expire-hours: 168
